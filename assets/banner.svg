<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -1px;
        fill: url(#textGrad);
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #8b949e;
        letter-spacing: 0.3px;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #58a6ff;
        text-transform: uppercase;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #c9d1d9;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Accents -->
  <circle cx="150" cy="80" r="140" fill="#388bfd" opacity="0.08" filter="blur(40px)" />
  <circle cx="1050" cy="220" r="160" fill="#238636" opacity="0.07" filter="blur(50px)" />

  <!-- Top Pill Tag -->
  <g transform="translate(80, 52)">
    <rect width="260" height="26" rx="13" fill="#161b22" stroke="#388bfd" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#3fb950" />
    <text x="28" y="17" class="pill-text">CLOUD SECURITY PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="142" class="banner-title">AWS Security Scanner</text>

  <!-- Subtitle -->
  <text x="80" y="186" class="banner-sub">Automated Vulnerability Detection, Compliance Auditing, and Active Remediation Engine</text>

  <!-- Key Capability Tags -->
  <g transform="translate(80, 236)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="65" y="20" class="badge-text" text-anchor="middle">EC2 &amp; IAM</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="150" height="32" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="217" y="20" class="badge-text" text-anchor="middle">S3 &amp; Storage</text>

    <!-- Tag 3 -->
    <rect x="304" y="0" width="160" height="32" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="384" y="20" class="badge-text" text-anchor="middle">Security Groups</text>

    <!-- Tag 4 -->
    <rect x="476" y="0" width="140" height="32" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="546" y="20" class="badge-text" text-anchor="middle">RDS &amp; Lambda</text>

    <!-- Tag 5 -->
    <rect x="628" y="0" width="150" height="32" rx="6" fill="#161b22" stroke="#30363d" />
    <text x="703" y="20" class="badge-text" text-anchor="middle">CloudTrail Audit</text>

    <!-- Tag 6 -->
    <rect x="790" y="0" width="180" height="32" rx="6" fill="#1f3b25" stroke="#238636" stroke-width="1.2" />
    <text x="880" y="20" class="badge-text" fill="#56d364" text-anchor="middle">Active Remediation</text>
  </g>
</svg>
