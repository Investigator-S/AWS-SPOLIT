<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dashFlow {
        to {
          stroke-dashoffset: -40;
        }
      }
      
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(88, 166, 255, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(88, 166, 255, 0.9)); }
      }

      @keyframes nodePulse {
        0%, 100% { stroke: #30363d; }
        50% { stroke: #58a6ff; }
      }

      .flow-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      
      .box {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 8px;
        transition: all 0.3s;
      }
      
      .box-accent {
        fill: #161b22;
        stroke: #58a6ff;
        stroke-width: 1.5;
        rx: 8px;
      }

      .box-remediate {
        fill: #161b22;
        stroke: #238636;
        stroke-width: 1.5;
        rx: 8px;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }

      .desc-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #8b949e;
        text-anchor: middle;
      }

      .sub-item {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #c9d1d9;
      }

      .wire {
        fill: none;
        stroke: #388bfd;
        stroke-width: 2;
        stroke-dasharray: 6, 6;
        animation: dashFlow 1.5s linear infinite;
      }

      .wire-green {
        fill: none;
        stroke: #3fb950;
        stroke-width: 2;
        stroke-dasharray: 6, 6;
        animation: dashFlow 1.5s linear infinite;
      }

      .header-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #8b949e;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background panel -->
  <rect x="2" y="2" width="916" height="296" class="flow-bg" />

  <!-- Section Label -->
  <text x="30" y="32" class="header-title">Scanner Architecture and Execution Pipeline</text>

  <!-- Connection Wires -->
  <path d="M 180 135 L 230 135" class="wire" />
  <path d="M 380 135 L 430 135" class="wire" />
  <path d="M 580 115 L 630 85" class="wire" />
  <path d="M 580 155 L 630 185" class="wire-green" />
  <path d="M 780 85 L 820 85" class="wire" />
  <path d="M 780 185 L 820 185" class="wire-green" />

  <!-- Node 1: Credentials & Auth -->
  <g transform="translate(30, 60)">
    <rect width="150" height="150" class="box" />
    <rect x="0" y="0" width="150" height="32" fill="#21262d" rx="8" />
    <rect x="0" y="24" width="150" height="8" fill="#21262d" />
    <text x="75" y="21" class="title-text" fill="#58a6ff">Authentication</text>
    <text x="75" y="55" class="desc-text">Credential Vault</text>
    <text x="20" y="80" class="sub-item">- Stored Vault (~/.aws)</text>
    <text x="20" y="100" class="sub-item">- Interactive Prompt</text>
    <text x="20" y="120" class="sub-item">- STS Token Verify</text>
    <text x="20" y="140" class="sub-item">- Region Routing</text>
  </g>

  <!-- Node 2: Discovery Engine -->
  <g transform="translate(230, 60)">
    <rect width="150" height="150" class="box" />
    <rect x="0" y="0" width="150" height="32" fill="#21262d" rx="8" />
    <rect x="0" y="24" width="150" height="8" fill="#21262d" />
    <text x="75" y="21" class="title-text" fill="#79c0ff">Discovery</text>
    <text x="75" y="55" class="desc-text">Pre-flight Verification</text>
    <text x="18" y="80" class="sub-item">- Service Probing</text>
    <text x="18" y="100" class="sub-item">- Resource Count</text>
    <text x="18" y="120" class="sub-item">- Access Permission</text>
    <text x="18" y="140" class="sub-item">- Health Indicators</text>
  </g>

  <!-- Node 3: Multi-Service Audit Engine -->
  <g transform="translate(430, 45)">
    <rect width="150" height="180" class="box-accent" />
    <rect x="0" y="0" width="150" height="32" fill="#1f3b5c" rx="8" />
    <rect x="0" y="24" width="150" height="8" fill="#1f3b5c" />
    <text x="75" y="21" class="title-text" fill="#ffffff">Audit Engine</text>
    <text x="75" y="52" class="desc-text">7 Security Scanners</text>
    <text x="18" y="74" class="sub-item">- EC2 &amp; EBS Volumes</text>
    <text x="18" y="92" class="sub-item">- S3 Buckets &amp; ACLs</text>
    <text x="18" y="110" class="sub-item">- IAM Users &amp; Keys</text>
    <text x="18" y="128" class="sub-item">- RDS &amp; Databases</text>
    <text x="18" y="146" class="sub-item">- Lambda Functions</text>
    <text x="18" y="164" class="sub-item">- Security Groups</text>
  </g>

  <!-- Node 4A: Assessment & Reporting -->
  <g transform="translate(630, 20)">
    <rect width="150" height="110" class="box" />
    <rect x="0" y="0" width="150" height="28" fill="#21262d" rx="8" />
    <rect x="0" y="20" width="150" height="8" fill="#21262d" />
    <text x="75" y="19" class="title-text" fill="#d29922">Risk Analysis</text>
    <text x="18" y="50" class="sub-item">- Critical / High / Med</text>
    <text x="18" y="70" class="sub-item">- CIS Benchmark Map</text>
    <text x="18" y="90" class="sub-item">- Severity Rating</text>
  </g>

  <!-- Node 4B: Remediation Engine -->
  <g transform="translate(630, 150)">
    <rect width="150" height="110" class="box-remediate" />
    <rect x="0" y="0" width="150" height="28" fill="#1b4728" rx="8" />
    <rect x="0" y="20" width="150" height="8" fill="#1b4728" />
    <text x="75" y="19" class="title-text" fill="#56d364">Remediation</text>
    <text x="18" y="50" class="sub-item">- Interactive Prompt</text>
    <text x="18" y="70" class="sub-item">- Automated Hotfix</text>
    <text x="18" y="90" class="sub-item">- Safety Verification</text>
  </g>

  <!-- Node 5: Output Artefacts -->
  <g transform="translate(820, 50)">
    <rect width="70" height="170" class="box" />
    <text x="35" y="50" class="title-text" fill="#58a6ff" transform="rotate(90 35 50)">REPORTS</text>
    <text x="22" y="130" class="sub-item">CLI</text>
    <text x="22" y="150" class="sub-item">TXT</text>
    <text x="22" y="170" class="sub-item">LOG</text>
  </g>
</svg>
